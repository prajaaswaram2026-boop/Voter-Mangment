 - type: web
    name: voter-management
    runtime: docker
    rootDir: voter-roll
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: voter-roll-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: STORAGE_DIR
        value: /tmp/storage
      - key: OTP_PROVIDER
        value: console

        services:
 

databases:
  - name: voter-roll-db
    plan: free
    databaseName: voterroll
    user: voterroll
